spring.application.name=cmpact2_t4
# Actividad 2: puerto distinto al de la Actividad 1 (8081)
server.port=8082

# Propiedades personalizadas leidas con @Value
# (los acentos van como escape unicode porque .properties se lee en ISO-8859-1)
app.nombre-proyecto=CMPact2_t4 - MVC con Thymeleaf
app.autor=Cristian Mart\u00ednez Pacheco

# Respeta el prefijo /act2-t4 cuando el proyecto se sirve detras de nginx
server.forward-headers-strategy=framework
