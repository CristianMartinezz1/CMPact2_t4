<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Título</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
        header { background: #1e3a8a; color: #fff; padding: 16px 24px; }
        header h1 { margin: 0; font-size: 1.3rem; }
        header p { margin: 4px 0 0; opacity: .85; font-size: .9rem; }
        nav { background: #fff; padding: 10px 24px; border-bottom: 1px solid #d9dee5; }
        nav a { margin-right: 16px; color: #1e3a8a; text-decoration: none; font-weight: 600; }
        main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border: 1px solid #d9dee5; border-radius: 8px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e9ef; }
        th { background: #eef2f7; }
        .chip { display: inline-block; padding: 4px 12px; margin: 0 6px 6px 0; border-radius: 999px;
                border: 1px solid #1e3a8a; color: #1e3a8a; text-decoration: none; font-size: .9rem; }
        .chip.activo { background: #1e3a8a; color: #fff; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; border: 1px solid #c3cad4; border-radius: 6px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 18px; background: #1e3a8a; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
        .ok { color: #166534; font-weight: 600; }
        .error { color: #b91c1c; font-weight: 600; }
        footer { text-align: center; color: #6b7280; font-size: .85rem; margin: 32px 0; }
    </style>
</head>
<body>

<div th:fragment="encabezado">
    <header>
        <!-- Valores leídos con @Value desde application.properties -->
        <h1 th:text="${nombreProyecto}">Nombre del proyecto</h1>
        <p>Autor: <span th:text="${autor}">Autor</span></p>
    </header>
    <nav>
        <a th:href="@{/materias}">Lista de materias</a>
        <a th:href="@{/materias/nueva}">Agregar materia</a>
    </nav>
</div>

<footer th:fragment="pie">Actividad 2 · Tema 4 · Spring Boot MVC + Thymeleaf</footer>

</body>
</html>
