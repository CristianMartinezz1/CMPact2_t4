<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Título</title>
    <style>
        :root {
            --jade: #2fb583;          /* verde jade medio */
            --jade-oscuro: #1f8a62;   /* bordes y acentos */
            --jade-claro: #e6f6ef;    /* fondos suaves */
            --jade-borde: #c5e9da;
            --texto: #111111;
            --texto-suave: #3d4a44;
            --fondo: #ffffff;
        }
        body { font-family: system-ui, sans-serif; margin: 0; background: var(--fondo); color: var(--texto); }
        header { background: var(--jade); color: var(--texto); padding: 18px 24px; }
        header h1 { margin: 0; font-size: 1.35rem; }
        nav { background: var(--fondo); padding: 12px 24px; border-bottom: 2px solid var(--jade); }
        nav a { margin-right: 20px; color: var(--texto); text-decoration: none; font-weight: 600;
                padding-bottom: 2px; border-bottom: 2px solid transparent; }
        nav a:hover { border-bottom-color: var(--jade-oscuro); }
        main { max-width: 900px; margin: 28px auto; padding: 0 16px; }
        .card { background: var(--fondo); border: 1px solid var(--jade-borde); border-radius: 10px; padding: 22px;
                box-shadow: 0 2px 8px rgba(31, 138, 98, .08); }
        h2 { margin-top: 0; }
        a { color: var(--texto); text-decoration-color: var(--jade-oscuro); text-underline-offset: 3px; }
        a:hover { text-decoration-thickness: 2px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--jade-borde); }
        th { background: var(--jade-claro); }
        tbody tr:hover { background: #f5fbf8; }
        .chip { display: inline-block; padding: 4px 14px; margin: 0 6px 6px 0; border-radius: 999px;
                border: 1px solid var(--jade-oscuro); color: var(--texto); text-decoration: none; font-size: .9rem; }
        .chip:hover { background: var(--jade-claro); }
        .chip.activo { background: var(--jade); border-color: var(--jade); font-weight: 600; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; border: 1px solid #b8c4be; border-radius: 6px; box-sizing: border-box; }
        input:focus { outline: 2px solid var(--jade); border-color: var(--jade); }
        button { margin-top: 16px; padding: 10px 18px; background: var(--jade); color: var(--texto); font-weight: 600;
                 border: 0; border-radius: 6px; cursor: pointer; }
        button:hover { background: var(--jade-oscuro); }
        .ok { font-weight: 600; padding: 10px 14px; background: var(--jade-claro); border-left: 4px solid var(--jade); }
        .error { font-weight: 600; padding: 10px 14px; background: #fdecec; border-left: 4px solid #d64545; }
    </style>
</head>
<body>

<div th:fragment="encabezado">
    <header>
        <!-- Valor leído con @Value desde application.properties -->
        <h1 th:text="${nombreProyecto}">Nombre del proyecto</h1>
    </header>
    <nav>
        <a th:href="@{/materias}">Lista de materias</a>
        <a th:href="@{/materias/nueva}">Agregar materia</a>
    </nav>
</div>

</body>
</html>
